apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockscout
  namespace: besu-app
  labels:
    app: blockscout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockscout
  template:
    metadata:
      labels:
        app: blockscout
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: db-migrate
          image: blockscout/blockscout:latest
          command:
            - /app/bin/blockscout
          args:
            - eval
            - "Elixir.Explorer.ReleaseTasks.create_and_migrate"
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:blockscout_db_secret_pass@blockscout-db:5432/blockscout?ssl=false"
            - name: PGSSLMODE
              value: "disable"
            - name: DATABASE_SSL
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: blockscout
          image: blockscout/blockscout:latest
          command:
            - /app/bin/blockscout
          args:
            - start
          env:
            - name: PORT
              value: "4000"
            - name: COIN
              value: "RIR"
            - name: ETHEREUM_JSONRPC_VARIANT
              value: "besu"
            - name: ETHEREUM_JSONRPC_HTTP_URL
              value: "http://public-rpc.besu-public.svc.cluster.local:8545"
            - name: ETHEREUM_JSONRPC_TRACE_URL
              value: "http://public-rpc.besu-public.svc.cluster.local:8545"
            - name: DATABASE_URL
              value: "postgresql://postgres:blockscout_db_secret_pass@blockscout-db:5432/blockscout?ssl=false"
            - name: PGSSLMODE
              value: "disable"
            - name: DATABASE_SSL
              value: "false"
            - name: REDIS_URL
              value: "redis://blockscout-redis:6379/0"
            - name: SECRET_KEY_BASE
              value: "super_secret_key_base_must_be_64_bytes_long_12345678901234567890123456789012"
            - name: INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER
              value: "true"
            - name: POOL_SIZE
              value: "20"
          ports:
            - containerPort: 4000
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1.5"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: blockscout
  namespace: besu-app
spec:
  ports:
    - port: 4000
      targetPort: 4000
      name: http
  selector:
    app: blockscout
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blockscout-ingress
  namespace: besu-app
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  rules:
    - host: explorer.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blockscout
                port:
                  number: 4000
