name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-private-contracts:
    name: Private Contracts Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'besu-network/private-network/8.contracts/package-lock.json'

      - name: Install dependencies
        run: |
          cd besu-network/private-network/8.contracts
          npm ci

      - name: Run Hardhat Tests
        run: |
          cd besu-network/private-network/8.contracts
          npx hardhat test --network hardhat

  test-bridge-components:
    name: Bridge & Relayer Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'besu-network/bridge/anchor-service/package-lock.json'

      - name: Install Relayer dependencies
        run: |
          cd besu-network/bridge/anchor-service
          npm ci

      - name: Compile TS Relayer
        run: |
          cd besu-network/bridge/anchor-service
          npx tsc

      - name: Install Bridge Hardhat dependencies
        run: |
          cd besu-network/bridge
          npm ci

      - name: Compile Bridge Contract
        run: |
          cd besu-network/bridge
          npx hardhat compile
