# cert-manager CA Issuer setup for Hyperledger Besu Private Network.
# Establishes the cluster-internal CA hierarchy.

apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: besu-private-selfsigned-issuer
  namespace: besu-private
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: besu-private-ca
  namespace: besu-private
spec:
  isCA: true
  commonName: besu-private-root-ca
  secretName: besu-private-ca-keypair
  issuerRef:
    name: besu-private-selfsigned-issuer
    kind: Issuer
  privateKey:
    algorithm: ECDSA
    size: 256
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: besu-private-ca-issuer
  namespace: besu-private
spec:
  ca:
    secretName: besu-private-ca-keypair
