# cert-manager Certificate template reference for a Besu Private Network node.
# NOTE: The actual certificates for all 15 nodes are dynamically generated by:
#       private-network/3.5.tls/generate-tls-certs.sh
#
# This file serves as a reference for the Certificate manifests.

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: node-tls-template
  namespace: besu-private
spec:
  # Secret where the generated PKCS#12 keystore, CA certificate,
  # private key, and password are stored.
  secretName: node-tls-template-secret
  
  issuerRef:
    name: besu-private-ca-issuer
    kind: Issuer
    
  commonName: validator-afrinic.besu-private.svc.cluster.local
  dnsNames:
    - validator-afrinic.besu-private.svc.cluster.local
    - validator-afrinic
    
  # Enable PKCS#12 keystore creation for Besu
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: validator-afrinic-tls-password # Secret containing the keystore password
        key: password
        
  duration: 2160h        # 90 days
  renewBefore: 360h       # 15 days
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
