apiVersion: v1
kind: ConfigMap
metadata:
  name: qbft-config-private
  namespace: besu-private
data:
  qbftConfigFile.json: |
    {
      "genesis": {
        "config": {
          "chainId": 78901,
          "londonBlock": 0,
          "shanghaiTime": 0,
          "zeroBaseFee": true,
          "qbft": {
            "blockperiodseconds": 5,
            "epochlength": 30000,
            "requesttimeoutseconds": 10,
            "emptyblockperiodseconds": 60
          }
        },
        "nonce": "0x0",
        "timestamp": "0x0",
        "gasLimit": "0x1C9C380",
        "difficulty": "0x1",
        "coinbase": "0x0000000000000000000000000000000000000000",
        "alloc": {
          "0000000000000000000000000000000000009999": { "balance": "0", "comment": "NodeIngress permissioning contract" },
          "0000000000000000000000000000000000008888": { "balance": "0", "comment": "AccountIngress permissioning contract" }
        }
      },
      "blockchain": { "nodes": { "generate": true, "count": 4 } }
    }
  generate.sh: |
    #!/bin/sh
    set -eu
    echo "Generating validator configs (4 nodes)..."
    rm -rf /out/validators /out/non-validators
    mkdir -p /out/validators
    besu operator generate-blockchain-config \
      --config-file=/config/qbftConfigFile.json \
      --to=/out/validators \
      --private-key-file-name=key

    echo "Generating non-validator keys (5 nodes)..."
    mkdir -p /out/non-validators
    cat <<EOF > /tmp/non-validators-config.json
    {
      "genesis": {
        "config": {
          "chainId": 78901,
          "qbft": {
            "blockperiodseconds": 5
          }
        }
      },
      "blockchain": { "nodes": { "generate": true, "count": 5 } }
    }
    EOF
    besu operator generate-blockchain-config \
      --config-file=/tmp/non-validators-config.json \
      --to=/out/non-validators \
      --private-key-file-name=key
    echo "Generation complete!"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: generate-genesis
  namespace: besu-private
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generate-genesis
          image: hyperledger/besu:24.12.2
          command:
            - /bin/sh
            - /config/generate.sh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: config
              mountPath: /config
            - name: out
              mountPath: /out
      volumes:
        - name: config
          configMap:
            name: qbft-config-private
        - name: out
          persistentVolumeClaim:
            claimName: genesis-output-pvc
