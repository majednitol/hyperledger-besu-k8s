# PersistentVolumes for local Minikube nfs mount (/Users/majedurrahman/nfs_share -> /mnt/data)
# Maps all block storage to subdirectories inside the mounted NFS share, ensuring
# data persistency and preventing minikube node disk-full crashes.

apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-private-genesis
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /mnt/data/private-genesis
    type: DirectoryOrCreate
  claimRef:
    namespace: besu-private
    name: genesis-output-pvc
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-public-genesis
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /mnt/data/public-genesis
    type: DirectoryOrCreate
  claimRef:
    namespace: besu-public
    name: genesis-output-pvc
---
