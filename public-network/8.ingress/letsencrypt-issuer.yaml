# cert-manager ClusterIssuers configuration for Let's Encrypt TLS Certificates.
# Used by public-facing Ingress endpoints (RPC, Explorer, and UI).

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Staging ACME directory
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # Replace with a valid administrator contact email
    email: admin@yourdomain.com
    privateKeySecretRef:
      name: letsencrypt-staging-private-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Production ACME directory
    server: https://acme-v02.api.letsencrypt.org/directory
    # Replace with a valid administrator contact email
    email: admin@yourdomain.com
    privateKeySecretRef:
      name: letsencrypt-prod-private-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
