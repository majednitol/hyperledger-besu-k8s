# Test Certificate manifest to verify ClusterIssuer functionality.
# Request a staging certificate to prove ACME HTTP-01 DNS routing works correctly.

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-letsencrypt-cert
  namespace: besu-public
spec:
  secretName: test-letsencrypt-cert-secret
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    # Replace with your configured domain when running in target environment
    - test-besu.yourdomain.com
  usages:
    - digital signature
    - key encipherment
    - server auth
